kind: PersistentVolume 
apiVersion: v1 
metadata: 
  name: prometheus-pv 
  namespace: monitoring 
spec: 
  storageClassName: prometheus-storage 
  capacity: 
    storage: 5Gi 
  persistentVolumeReclaimPolicy: Retain 
  accessModes: 
    - ReadWriteOnce
  hostPath: 
    path: /prometheus 
    type: DirectoryOrCreate
