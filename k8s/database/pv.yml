kind: PersistentVolume 
apiVersion: v1 
metadata: 
  name: mongo-pv
  namespace: govt-ip
  labels: 
    app: mongo-pv  
spec: 
  storageClassName: mongo-storage 
  capacity: 
    storage: 5Gi 
  accessMode: 
    - ReadWriteOnce 
  persistentVolumeReclaimPolicy: Retain 
  hostPath: 
    path: /mnt/data